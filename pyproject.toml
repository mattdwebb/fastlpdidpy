[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
readme = "README.md"
name = "fastlpdidpy"
version = "0.1.0.dev0"
description = "Native reference LP-DiD for absorbing-treatment panels"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2"]
license = "MIT"
authors = [{name = "Matthew D. Webb", email = "matt.webb@carleton.ca"}]

[tool.setuptools.packages.find]
include = ["fastlpdidpy*"]

[project.optional-dependencies]
examples = ["pandas>=2"]
test = ["pytest>=7", "scipy"]

[project.urls]
Repository = "https://github.com/mattdwebb/fastlpdidpy"
Issues = "https://github.com/mattdwebb/fastlpdidpy/issues"
